<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Workspace</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 id="workspaceTitle">Workspace</h2>

          <p id="workspaceInfo" class="text-muted"></p>
          <div id="workspaceActions" class="mb-3"></div>
          <div id="workspaceMembers" class="mb-4"></div>
        </div>

        <a href="dashboard.html" class="btn btn-secondary"> Back </a>
      </div>
      <div class="card p-4 shadow-sm mb-5">
        <h4 class="mb-3">Add Resource</h4>

        <input
          type="text"
          id="content"
          class="form-control mb-3"
          placeholder="Resource Content"
        />

        <input
          type="text"
          id="link"
          class="form-control mb-3"
          placeholder="Optional Link"
        />

        <input type="file" id="file" class="form-control mb-3" />

        <button id="addResourceBtn" class="btn btn-primary">
          Add Resource
        </button>
      </div>
      <div id="resourceList" class="row g-4"></div>
    </div>
    <div class="modal fade" id="deleteModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirm Delete</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            Are you sure you want to delete this resource?
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="button" id="confirmDeleteBtn" class="btn btn-danger">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="leaveWorkspaceModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Leave Workspace</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            Are you sure you want to leave this workspace?
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button
              type="button"
              id="confirmLeaveWorkspaceBtn"
              class="btn btn-danger"
            >
              Leave
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      id="toastContainer"
      class="toast-container position-fixed top-0 end-0 p-3"
    ></div>
    <script src="../js/config.js"></script>
    <script src="../js/toast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/workspace.js"></script>
  </body>
</html>
