<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PrepSpace Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Workspaces</h2>

        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>

      <div class="card p-4 shadow-sm mb-5">
        <h4 class="mb-3">Create Workspace</h4>

        <input
          type="text"
          id="workspaceName"
          class="form-control mb-3"
          placeholder="Workspace Name"
        />

        <input
          type="text"
          id="subject"
          class="form-control mb-3"
          placeholder="Subject"
        />

        <button id="createWorkspaceBtn" class="btn btn-primary">
          Create Workspace
        </button>
      </div>

      <div id="workspaceList" class="row g-4 mb-5"></div>
      <div class="card p-4 shadow-sm mb-5">
        <h4 class="mb-3">Join Workspace</h4>

        <input
          type="text"
          id="joinWorkspaceId"
          class="form-control mb-3"
          placeholder="Enter Workspace ID"
        />

        <button id="joinWorkspaceBtn" class="btn btn-success">
          Join Workspace
        </button>
      </div>
    </div>
    <div class="modal fade" id="workspaceDeleteModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Delete Workspace</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            Are you sure you want to delete this workspace?
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button
              type="button"
              id="confirmWorkspaceDeleteBtn"
              class="btn btn-danger"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="logoutModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Logout</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">Are you sure you want to logout?</div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="button" id="confirmLogoutBtn" class="btn btn-danger">
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      id="toastContainer"
      class="toast-container position-fixed top-0 end-0 p-3"
    ></div>
    <script src="../js/config.js"></script>
    <script src="../js/toast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
